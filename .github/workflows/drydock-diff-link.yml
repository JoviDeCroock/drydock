name: drydock-diff-link

# The Dependabot integration documented on the Docs page ("Diffs in dependency
# PRs") and in docs/dependency-pr-diff-links.md, running against this repo's own
# update PRs. Never checks out or executes the updated code.

on:
  pull_request:
    types: [opened]

# Dependabot-triggered runs honor this permissions key; the read-only default
# token does not apply when permissions are set explicitly.
permissions:
  pull-requests: write

jobs:
  diff-link:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - if: steps.meta.outputs.previous-version != '' && steps.meta.outputs.new-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          NAME: ${{ steps.meta.outputs.dependency-names }}
          FROM: ${{ steps.meta.outputs.previous-version }}
          TO: ${{ steps.meta.outputs.new-version }}
        run: |
          case "$ECOSYSTEM" in
            npm_and_yarn) path="$NAME" ;;
            pip) path="pypi/$NAME" ;;
            *) exit 0 ;;
          esac
          # Grouped PRs join every updated dependency into `dependency-names`,
          # while previous/new-version describe only the first one — so a
          # multi-dependency PR has no single pair to link.
          case "$NAME" in *,*) exit 0 ;; esac
          gh pr comment "$PR_URL" --body \
            "[Read the diff of $NAME $FROM → $TO](https://drydock.org/diff/$path/$FROM/$TO)"
