name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Keep running the remaining checks even if an earlier one fails so a single
      # CI run surfaces every failure (mirrors `pnpm run verify`). `!cancelled()`
      # still lets concurrency cancellation skip them.
      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm run test

      - name: Production build
        if: ${{ !cancelled() }}
        run: pnpm run build

      - name: Unused code check
        if: ${{ !cancelled() }}
        run: pnpm run knip

      - name: Production dependency audit
        if: ${{ !cancelled() }}
        run: pnpm audit --prod

      - name: Upload detection eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detection-eval-report
          path: .context/eval/detection-eval.*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E test
        run: E2E_APP_PORT=5200 E2E_REGISTRY_PORT=5201 pnpm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            .context/e2e-artifacts
            .context/e2e-registry/requests.jsonl
          if-no-files-found: ignore
          retention-days: 7

  detection-eval-comment:
    name: detection eval PR comment
    runs-on: ubuntu-latest
    needs: check
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download detection eval report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: detection-eval-report
          path: .context/eval

      - name: Comment detection eval report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/comment-detection-eval.mjs
