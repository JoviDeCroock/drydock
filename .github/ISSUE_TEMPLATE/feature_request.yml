name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - Deterministic detection
        - npm staged publishing
        - GitHub workflow gate
        - PyPI support
        - Notifications
        - Self-hosting
        - Other
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security boundary impact
      description: Note any impact on sandboxing, credential handling, auth, approval flow, or AI review.
      placeholder: No boundary impact expected.
