packages:
  - .

# kysely 0.29.x dropped DEFAULT_MIGRATION_TABLE / DEFAULT_MIGRATION_LOCK_TABLE from its
# root export; @better-auth/kysely-adapter still imports them from "kysely", so rolldown
# (vite 8) fails the build with MISSING_EXPORT. Pin to the 0.28.x line, which re-exports
# them and satisfies every consumer's peer range. Revisit when the adapter stops importing
# those constants from the package root.
overrides:
  kysely: ^0.28.17
  # @esbuild-kit is deprecated and still pins an esbuild version with GHSA-67mh-4wv8-2f99.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # Keep this plugin on the Node 22.13-compatible line while remediating transitive advisories.
  "@cloudflare/vite-plugin>wrangler": 4.102.0
  "@cloudflare/vite-plugin>miniflare": 4.20260617.0
  # Vite's PostCSS range otherwise resolves to versions with source-map path traversal advisories.
  postcss: ^8.5.23
  ws: 8.21.0
  # AI SDK 6 permits vulnerable Undici 7 releases; keep the patched cache,
  # retry, cookie, and header handling until its dependency floor catches up.
  undici: ^7.29.0

allowBuilds:
  "0": esbuild
  "1": sharp
  "2": workerd
  esbuild: true
  sharp: true
  workerd: true
